pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr emerg;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Nao registra URI, query string, cookies, cabecalhos ou corpo.
    log_format operational '$time_iso8601 method=$request_method status=$status '
                           'bytes=$body_bytes_sent duration=$request_time request_id=$request_id';
    access_log /dev/stdout operational;

    limit_req_zone $binary_remote_addr zone=requests_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream streamlit {
        server dashboard:8501;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        return 308 https://$host$request_uri;
    }

    # Healthcheck interno, sem publicacao de porta.
    server {
        listen 8081;
        access_log off;
        location = /healthz {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 8443 ssl default_server;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        client_max_body_size 6m;
        client_body_timeout 30s;
        keepalive_timeout 30s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

        limit_req zone=requests_per_ip burst=30 nodelay;
        limit_req_status 429;
        limit_conn connections_per_ip 20;

        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_hide_header X-Powered-By;
        }
    }
}
