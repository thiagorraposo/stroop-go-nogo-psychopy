error_page 400 408 414 494 495 496 497 = @bad_request;
error_page 403 = @forbidden;
error_page 404 = @not_found;
error_page 405 = @method_not_allowed;
error_page 413 = @body_too_large;
error_page 429 = @rate_limited;
error_page 500 502 503 504 = @unavailable;
location @bad_request { include /etc/nginx/web/error-headers.conf; default_type application/json; return 400 '{"error":{"code":"invalid_json"}}'; }
location @forbidden { include /etc/nginx/web/error-headers.conf; default_type application/json; return 403 '{"error":{"code":"permission_denied"}}'; }
location @not_found { include /etc/nginx/web/error-headers.conf; default_type application/json; return 404 '{"error":{"code":"not_found"}}'; }
location @method_not_allowed { include /etc/nginx/web/error-headers.conf; default_type application/json; return 405 '{"error":{"code":"method_not_allowed"}}'; }
location @body_too_large { include /etc/nginx/web/error-headers.conf; default_type application/json; return 413 '{"error":{"code":"body_too_large"}}'; }
location @rate_limited { include /etc/nginx/web/error-headers.conf; add_header Retry-After "1" always; default_type application/json; return 429 '{"error":{"code":"rate_limited"}}'; }
location @unavailable { include /etc/nginx/web/error-headers.conf; default_type application/json; return 503 '{"error":{"code":"service_unavailable"}}'; }
