name: WEB validada
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: stroop_etapa4_test_ci
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U synthetic -d stroop_etapa4_test_ci"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Banco descartavel do job
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          printf 'TEST_DATABASE_URL=postgresql://synthetic:synthetic-ci-only@127.0.0.1:%s/stroop_etapa4_test_ci\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
      - name: Checkout somente leitura
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/database/
            !/production-secrets/
            !**/.env*
            /.env.example
            /.env.production.example
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Ambiente Python isolado
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r dashboard/requirements.lock -r api/requirements.lock
          .venv/bin/python -m pip check
      - name: Scanner oficial de secrets
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
          .venv/bin/python scripts/verify_web_ci.py sources
          .venv/bin/python scripts/verify_web_ci.py secret-self-test
      - name: Python e contratos HTTP com PostgreSQL real, sem skips
        run: .venv/bin/python scripts/verify_web_ci.py python
      - name: Frontend e build
        run: .venv/bin/python scripts/verify_web_ci.py frontend
      - name: Navegadores oficiais Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Navegadores isolados e motor temporal serial
        run: .venv/bin/python scripts/verify_web_ci.py browser
      - name: HTTPS, API e PostgreSQL ponta a ponta reais
        run: .venv/bin/python scripts/verify_web_ci.py integration
      - name: Vulnerabilidades conhecidas das dependencias
        run: .venv/bin/python scripts/verify_web_ci.py audit
